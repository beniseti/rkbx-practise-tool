<text x="20" y="722" font-size="13">⚠ Nunca conectes los 12 V al ESP32 ni al conversor: su lado HV va a 5 V (regulador) y su lado LV a 3,3 V (pin 3V3 del ESP32).</text>
<text x="20" y="738" font-size="13">⚠ Todas las masas unidas: fuente, regulador, ESP32, conversor (sus dos GND) y las 3 tiras.</text>
<text x="20" y="754" font-size="13">· Cada tira lleva su propio cable de +12 V y GND desde la fuente (no en cadena).</text>
<text x="20" y="770" font-size="13">· Los datos entran por el extremo DIN (donde empieza la flecha impresa en la tira).</text>
<text x="20" y="786" font-size="13">· Se usan 3 de sus 4 canales (LV1-3 → HV1-3). Si alguna tira parpadea, prueba a conectar el GPIO directo a DIN.</text>
