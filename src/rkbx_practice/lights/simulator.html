<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de luces</title>
<style>
  :root {
    --bg: #101010; --panel: #1b1b1b; --panel2: #242424; --border: #333;
    --text: #e6e6e6; --dim: #8c8c8c; --accent: #2a8cff; --ok: #4caf50; --bad: #e53935;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           background: var(--panel2); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); display: inline-block; }
  .dot.on { background: var(--ok); }
  .dim { color: var(--dim); }
  main { padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 320px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .stage { background: #000; border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
           position: relative; }
  #room { position: absolute; inset: 0; transition: background 60ms linear; opacity: .35; }
  canvas { display: block; width: 100%; height: 260px; position: relative; }
  .now { display: flex; gap: 16px; padding: 8px 12px; border-top: 1px solid var(--border);
         background: var(--panel); position: relative; flex-wrap: wrap; }
  .now b { color: #fff; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 10px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim);
              margin: 0 0 8px; font-weight: 600; }
  #log { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto;
         font-family: Consolas, "SF Mono", monospace; font-size: 12px; }
  #log li { padding: 3px 4px; border-bottom: 1px solid #222; display: flex; gap: 8px; }
  #log li .t { color: var(--dim); flex: none; }
  #log li .fx { color: #ffe14d; flex: none; min-width: 58px; }
  #log li.test .fx { color: #7fb0ff; }
  #log li.err .fx { color: var(--bad); }
  .tests { display: grid; gap: 6px; }
  .tests .row { display: grid; grid-template-columns: 80px 1fr 56px; gap: 6px; align-items: center; }
  input, button { font: inherit; color: var(--text); background: var(--panel2);
                  border: 1px solid var(--border); border-radius: 3px; padding: 4px 6px; min-width: 0; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .opts { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Simulador de luces</h1>
  <span><span class="dot" id="dot"></span> <span id="status" class="dim">conectando…</span></span>
  <span class="dim" id="udp"></span>
</header>
<main>
  <section>
    <div class="stage">
      <div id="room"></div>
      <canvas id="strip"></canvas>
      <div class="now">
        <span>Efecto: <b id="nowFx">—</b></span>
        <span>Base: <b id="nowBase">apagado</b></span>
        <span class="dim" id="count">0 comandos</span>
        <span class="dim" id="sync">sin sync</span>
      </div>
    </div>
    <div class="panel" style="margin-top:16px">
      <h2>Probar efectos</h2>
      <div class="tests" id="tests"></div>
      <div class="opts">
        <span class="dim" id="layoutInfo"></span>
        <label>Zonas <input id="zones" placeholder="all · odd · even · strip:2 · section:1 · 1,5,9" style="width:260px"></label>
      </div>
    </div>
  </section>
  <aside class="panel">
    <h2>Comandos recibidos</h2>
    <ul id="log"></ul>
  </aside>
</main>
<script>
"use strict";
// --- Colores (nombres en español e inglés, o #rrggbb / [r,g,b]) -----------------
const NAMED = {
  rojo:[255,0,0], red:[255,0,0], verde:[0,255,0], green:[0,255,0], azul:[0,80,255], blue:[0,80,255],
  blanco:[255,255,255], white:[255,255,255], amarillo:[255,220,0], yellow:[255,220,0],
  naranja:[255,120,0], orange:[255,120,0], morado:[150,0,255], purple:[150,0,255],
  violeta:[150,0,255], rosa:[255,60,160], pink:[255,60,160], cian:[0,230,255], cyan:[0,230,255],
  magenta:[255,0,255], negro:[0,0,0], black:[0,0,0]
};
function parseColor(c, dflt) {
  if (Array.isArray(c) && c.length >= 3) return c.slice(0, 3).map(Number);
  if (typeof c === "string") {
    const k = c.trim().toLowerCase();
    if (NAMED[k]) return NAMED[k];
    const m = /^#?([0-9a-f]{6})$/i.exec(k);
    if (m) { const n = parseInt(m[1], 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  }
  return dflt;
}
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const scale = (a, k) => a.map(v => v * k);
function hsv(h, s, v) {
  const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  const r = [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][((i % 6) + 6) % 6];
  return r.map(x => x * 255);
}

// --- Montaje: cada tira con sus píxeles y segmentos; zonas numeradas tira a tira ------------
// (igual que el ESP32: config.json lights.layout, cambia en marcha con el comando "layout")
const L = { strips: [{ leds: 14, segments: 3 }, { leds: 14, segments: 3 }, { leds: 14, segments: 3 }],
            owner: [], total: 0 };
const nZones = () => L.owner.length;
function setLayout(strips) {
  const ok = (Array.isArray(strips) ? strips : []).slice(0, 4).map(s => ({
    leds: Math.max(1, Math.min(300, Number(s.leds ?? s.pixels) || 14)),
    segments: Math.max(1, Math.min(8, Number(s.segments) || 1)) }));
  if (ok.length) L.strips = ok;
  L.owner = []; L.total = 0;
  L.strips.forEach((s, si) => {
    for (let c = 0; c < s.segments; c++) {
      const a = Math.floor(c * s.leds / s.segments), b = Math.floor((c + 1) * s.leds / s.segments);
      L.owner.push({ strip: si, seg: c, a, n: b - a, leds: s.leds, k0: L.total + a });
    }
    L.total += s.leds;
  });
  document.getElementById("layoutInfo").textContent =
    `${L.strips.length} tiras · ${nZones()} zonas (` +
    L.strips.map((s, i) => `T${i + 1}: ${s.leds} píx/${s.segments} seg`).join(" · ") + ")";
}

function expandZones(spec) {
  const all = Array.from({ length: nZones() }, (_, i) => i + 1);
  if (spec === undefined || spec === null || spec === "" || spec === "all" || spec === "todas") return all;
  if (Array.isArray(spec)) return spec.map(Number).filter(z => z >= 1 && z <= nZones());
  const t = String(spec).trim().toLowerCase();
  if (t === "odd" || t === "impares") return all.filter(z => z % 2 === 1);
  if (t === "even" || t === "pares") return all.filter(z => z % 2 === 0);
  const m = /^(strip|tira|section|seccion|sección|segment|segmento):(\d+)$/.exec(t);
  if (m) {
    const n = Number(m[2]);
    return ["strip", "tira"].includes(m[1]) ? all.filter(z => L.owner[z - 1].strip + 1 === n)
                                            : all.filter(z => L.owner[z - 1].seg + 1 === n);
  }
  return t.split(",").map(Number).filter(z => z >= 1 && z <= nZones());
}

// --- Estado por zona ------------------------------------------------------------------
// base: modo de fondo permanente ("solid", "pulse", "breathe", "alternate", "chase").
// overlay: efecto temporal encima (flash, strobe, rainbow, build…).
const S = { zones: [], count: 0 };
function resetZones() {
  S.zones = Array.from({ length: nZones() }, () => ({ base: { mode: "solid", color: [0,0,0], since: 0 },
                                                       prevBase: null, baseAt: 0, overlay: null }));
}
setLayout(L.strips);
resetZones();

function apply(cmd) {
  const now0 = performance.now();
  const fx = String(cmd.fx || "?").toLowerCase();
  if (fx === "sync") { applySync(cmd, now0); return; }
  if (fx === "layout") { setLayout(cmd.strips); resetZones(); return; }
  // `phase`: punto del beat (0..1) en el que se aplica; se alinea el reloj de beats del efecto.
  const beatMsCmd = 60000 / (Number(cmd.bpm) || 128);
  const now = cmd.phase !== undefined ? now0 - Number(cmd.phase) * beatMsCmd : now0;
  const dur = Number(cmd.dur_ms ?? cmd.duration_ms ?? 0);
  const color = (d) => parseColor(cmd.color, d);
  const targets = expandZones(cmd.zones);
  const bpm = Number(cmd.bpm) || 128;
  targets.forEach((z, pos) => {
    const st = S.zones[z - 1];
    const setBase = (b) => { st.prevBase = st.base; st.base = { ...b, since: now }; st.baseAt = now; st.overlay = null; };
    const over = (o) => { st.overlay = { ...o, start: now, pos, count: targets.length }; };
    switch (fx) {
      case "color": setBase({ mode: "solid", color: color([0,80,255]) }); break;
      case "off": setBase({ mode: "solid", color: [0,0,0] }); break;
      case "pulse": setBase({ mode: "pulse", color: color([150,0,255]), bpm }); break;
      case "breathe": setBase({ mode: "breathe", color: color([0,80,255]), period: Number(cmd.period_ms) || 4000 }); break;
      case "alternate": setBase({ mode: "alternate", color: color([150,0,255]),
                                  color2: parseColor(cmd.color2, [0,0,0]), bpm, zone: z }); break;
      case "chase": setBase({ mode: "chase", color: color([255,120,0]), bpm, beats: Number(cmd.beats) || 1,
                              pos, count: targets.length }); break;
      case "wave": setBase({ mode: "wave", color: color([0,80,255]), color2: parseColor(cmd.color2, [0,0,0]),
                             bpm, beats: Number(cmd.beats) || 4 }); break;
      case "twinkle": setBase({ mode: "twinkle", color: color([0,80,255]), color2: parseColor(cmd.color2, [0,0,0]),
                                bpm, density: Number(cmd.density) || 0.15 }); break;
      case "flash": over({ fx, dur: dur || 200, color: color([255,255,255]) }); break;
      case "strobe": over({ fx, dur: dur || 1000, color: color([255,255,255]), hz: Number(cmd.hz || 12) }); break;
      case "rainbow": over({ fx, dur: dur || 4000, speed: Number(cmd.speed || 0.5) }); break;
      case "build": over({ fx, dur: dur || 8000, color: color([255,255,255]) }); break;
      case "prebuild": over({ fx, dur: dur || 16000, color: color([0,80,255]) }); break;
      case "identify": case "identificar": over({ fx: "identify", dur: dur || 6000, color: [255,255,255] }); break;
      default: over({ fx: "unknown", dur: dur || 600, color: [160, 0, 255] });
    }
  });
  document.getElementById("nowFx").textContent =
    `${fx}${cmd.zones && cmd.zones !== "all" ? ` → zonas ${targets.join(",")}` : ""}`;
  document.getElementById("nowBase").textContent = describeBases();
}

// `sync` (cada compás): BPM y fase reales del deck. Re-alinea los fondos que siguen el beat sin
// cambiar el efecto ni el color (así no se desfasan aunque cambie el pitch).
function applySync(cmd, now) {
  const bpm = Number(cmd.bpm) || 128, beatMs = 60000 / bpm;
  const anchor = now - (Number(cmd.phase) || 0) * beatMs;
  S.zones.forEach(st => {
    const b = st.base;
    if (["pulse", "alternate", "chase", "wave", "twinkle"].includes(b.mode)) {
      // Se conserva el n.º de beat (para alternancias y persecuciones) y se corrige la fase.
      const beats = Math.round((anchor - b.since) / (60000 / (b.bpm || bpm)));
      b.since = anchor - beats * beatMs;
      b.bpm = bpm;
    }
  });
  S.syncs = (S.syncs || 0) + 1;
  document.getElementById("sync").textContent = `sync ${bpm.toFixed(1)} BPM (${S.syncs})`;
}

function describeBases() {
  const modes = {};
  S.zones.forEach(z => { const b = z.base, k = b.color.every(v => v === 0) && b.mode === "solid" ? "apagado" : b.mode;
                         modes[k] = (modes[k] || 0) + 1; });
  const names = { solid: "color", pulse: "pulso", breathe: "respiración", alternate: "alterno", chase: "persecución",
                  wave: "ola", twinkle: "destellos" };
  return Object.entries(modes).map(([k, n]) => `${names[k] || k} ×${n}`).join(" · ");
}

// Pseudoaleatorio estable por LED (para los destellos).
function hash(x) { x = Math.sin(x * 12.9898) * 43758.5453; return x - Math.floor(x); }

// x: posición del LED en su tira (0..1 a lo largo de las 3 secciones); s: tira (0..); k: LED global.
function baseColor(b, now, x = 0, s = 0, k = 0) {
  if (!b) return [0,0,0];
  const beatMs = 60000 / (b.bpm || 128);
  if (b.mode === "pulse") {                       // golpe en cada beat que decae
    const ph = ((now - b.since) % beatMs) / beatMs;
    return scale(b.color, 0.25 + 0.75 * Math.pow(1 - ph, 3));
  }
  if (b.mode === "breathe") {
    const ph = ((now - b.since) % b.period) / b.period;
    return scale(b.color, 0.15 + 0.85 * (0.5 - 0.5 * Math.cos(ph * 2 * Math.PI)));
  }
  if (b.mode === "alternate") {                   // pares e impares se turnan en cada beat
    const beat = Math.floor((now - b.since) / beatMs);
    const ph = ((now - b.since) % beatMs) / beatMs;
    const mine = (b.zone + beat) % 2 === 0;
    return mine ? scale(b.color, 0.35 + 0.65 * Math.pow(1 - ph, 2)) : scale(b.color2, 0.35);
  }
  if (b.mode === "wave") {                        // ola que recorre las tiras: una vuelta cada `beats` beats
    const cycle = beatMs * b.beats;
    const ph = ((now - b.since) % cycle) / cycle;
    const v = 0.5 + 0.5 * Math.sin(2 * Math.PI * (x * 1.5 - ph) + s * 0.9);
    return mix(scale(b.color2, 0.25), b.color, Math.pow(v, 2));
  }
  if (b.mode === "twinkle") {                     // destellos aleatorios sobre un fondo tenue
    const slot = Math.floor((now - b.since) / (beatMs / 2));        // nuevo reparto cada medio beat
    const ph = ((now - b.since) % (beatMs / 2)) / (beatMs / 2);
    const on = hash(k * 7.13 + slot * 1.37) < b.density;
    const bg = scale(b.color2, 0.12 + 0.08 * Math.sin((now - b.since) / 900 + k));
    return on ? mix(bg, b.color, 1 - ph) : bg;
  }
  if (b.mode === "chase") {                       // la luz recorre las zonas, una por paso
    const step = Math.floor((now - b.since) / (beatMs * b.beats));
    const ph = ((now - b.since) % (beatMs * b.beats)) / (beatMs * b.beats);
    return step % b.count === b.pos ? scale(b.color, 0.4 + 0.6 * (1 - ph)) : scale(b.color, 0.06);
  }
  return b.color;
}

function zoneBase(st, now, x, s, k) {
  const f = Math.min(1, (now - st.baseAt) / 150);   // fundido de 150 ms entre fondos
  return mix(baseColor(st.prevBase, now, x, s, k), baseColor(st.base, now, x, s, k), f);
}

// Color de un LED: índice dentro de la zona (i de n), para efectos que recorren la zona.
function ledColor(st, now, i, z) {
  const o0 = L.owner[z - 1], n = o0.n, s = o0.strip;
  const x = (o0.a + i + 0.5) / o0.leds;                    // posición a lo largo de la tira
  const k = o0.k0 + i;                                     // píxel en el conjunto de tiras
  const base = zoneBase(st, now, x, s, k);
  const o = st.overlay;
  if (!o) return base;
  const p = (now - o.start) / o.dur;
  if (p >= 1) { st.overlay = null; return base; }
  if (o.fx === "flash") return mix(base, o.color, Math.pow(1 - p, 1.6));
  if (o.fx === "strobe") {
    const on = Math.floor((now - o.start) / (1000 / o.hz / 2)) % 2 === 0;
    return on ? o.color : scale(base, 0.15);
  }
  if (o.fx === "rainbow") {
    const t = (now - o.start) / 1000 * o.speed;
    const fade = Math.min(1, (1 - p) * 6);
    return mix(base, hsv(k / Math.max(1, L.total) + t, 1, 1), fade);
  }
  if (o.fx === "identify") {                       // cada zona con su color; el 1.er píxel en blanco
    if (i === 0) return [255, 255, 255];
    return Math.floor((now - o.start) / 400) % 2 === 0 ? hsv((z - 1) / Math.max(1, nZones()), 1, 1) : scale(base, 0.1);
  }
  if (o.fx === "prebuild") {                       // carga: las tiras se van llenando hasta el final
    const edge = 0.06;
    const dim = scale(base, 0.2);
    if (x > p) return dim;
    const lvl = 0.35 + 0.65 * p;
    if (p - x < edge) return mix(scale(o.color, lvl), [255, 255, 255], 0.6 * (1 - (p - x) / edge));
    return mix(dim, o.color, lvl);
  }
  if (o.fx === "build") {                          // tensión: sube el brillo y el parpadeo se acelera
    const hz = 1 + 15 * p * p;
    const on = Math.floor((now - o.start) / 1000 * hz * 2) % 2 === 0;
    const lit = n * (0.2 + 0.8 * p);              // se encienden LEDs desde el centro de cada zona
    return Math.abs(i - (n - 1) / 2) <= lit / 2
      ? mix(scale(base, 0.3), o.color, on ? 0.25 + 0.75 * p : 0.1 * p) : scale(base, 0.3);
  }
  return mix(base, o.color, Math.sin(p * Math.PI));
}

// --- Dibujo: una fila por tira, cada tira partida en sus secciones ---------------------
const canvas = document.getElementById("strip"), ctx = canvas.getContext("2d");
const room = document.getElementById("room");
function draw(now) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const nS = L.strips.length, gap = 14, padX = 34, rowH = h / nS;
  const maxLeds = Math.max(...L.strips.map(t => t.leds));
  const unit = (w - 2 * padX - gap * 7) / maxLeds;          // misma escala para todas las tiras
  const size = Math.max(1.5, Math.min(7, unit * 0.36));
  let avg = [0,0,0], total = 0;
  ctx.font = "11px Segoe UI, Arial"; ctx.textBaseline = "middle";
  L.owner.forEach((o, zi) => {
    const z = zi + 1, st = S.zones[zi], y = rowH * (o.strip + 0.5);
    if (o.seg === 0) { ctx.shadowBlur = 0; ctx.fillStyle = "#666"; ctx.fillText(`T${o.strip + 1}`, 6, y); }
    const x0 = padX + o.a * unit + o.seg * gap, segW = o.n * unit;
    ctx.shadowBlur = 0; ctx.fillStyle = "#444";
    ctx.fillText(String(z), x0 + segW / 2 - 3, y - Math.max(14, size * 3));
    for (let i = 0; i < o.n; i++) {
      const col = ledColor(st, now, i, z);
      const x = x0 + (i + 0.5) * unit;
      const rgb = `rgb(${col.map(v => Math.round(Math.max(0, Math.min(255, v)))).join(",")})`;
      const lit = Math.max(...col) > 8;
      ctx.shadowBlur = lit ? size * 3 : 0; ctx.shadowColor = rgb;
      ctx.fillStyle = lit ? rgb : "#1a1a1a";
      ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
      avg = avg.map((v, k) => v + col[k]); total++;
    }
  });
  ctx.shadowBlur = 0;
  avg = avg.map(v => v / Math.max(total, 1));
  room.style.background = `radial-gradient(ellipse at center, rgb(${avg.map(Math.round).join(",")}) 0%, transparent 70%)`;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// --- Registro --------------------------------------------------------------
function logCmd(msg) {
  const li = document.createElement("li");
  const cmd = msg.cmd || {};
  if (msg.origin === "prueba") li.className = "test";
  if (cmd.error) li.className = "err";
  const t = new Date((msg.t || Date.now() / 1000) * 1000).toLocaleTimeString();
  const { fx, ...rest } = cmd;
  li.innerHTML = `<span class="t"></span><span class="fx"></span><span class="p"></span>`;
  li.querySelector(".t").textContent = t;
  li.querySelector(".fx").textContent = fx ?? "?";
  li.querySelector(".p").textContent = Object.entries(rest).map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join(" ");
  const log = document.getElementById("log");
  log.prepend(li);
  while (log.children.length > 200) log.lastChild.remove();
  S.count++;
  document.getElementById("count").textContent = `${S.count} comandos`;
}

// --- Conexión con el servidor (Server-Sent Events) -----------------------------
function connect() {
  const es = new EventSource("/events");
  es.onopen = () => { document.getElementById("dot").classList.add("on");
                      document.getElementById("status").textContent = "conectado"; };
  es.onerror = () => { document.getElementById("dot").classList.remove("on");
                       document.getElementById("status").textContent = "sin conexión (¿está el simulador en marcha?)"; };
  es.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.cmd.fx !== "sync") logCmd(msg);            // los sync (cada compás) no llenan el registro
    if (!msg.cmd.error) apply(msg.cmd);
  };
}
connect();

// --- Botones de prueba -----------------------------------------------------------
function paramsText(obj) { return Object.entries(obj || {}).map(([k, v]) => `${k}=${v}`).join(" "); }
function parseParams(text) {
  const out = {};
  text.split(/\s+/).filter(Boolean).map(p => p.replace(/[,;]+$/, "")).forEach(part => {
    const i = part.indexOf("="); if (i < 1) return;
    const k = part.slice(0, i), v = part.slice(i + 1);
    out[k] = v !== "" && !isNaN(Number(v)) ? Number(v) : v;
  });
  return out;
}
fetch("/config").then(r => r.json()).then(cfg => {
  setLayout((cfg.layout || {}).strips);
  resetZones();
  document.getElementById("udp").textContent = `UDP ${cfg.udp}`;
  const effects = Object.keys(cfg.effects || {}).length ? cfg.effects
    : { color: { color: "azul" }, pulse: { color: "morado", bpm: 128 }, breathe: { color: "azul", period_ms: 4000 },
        alternate: { color: "morado", color2: "azul", bpm: 128 }, chase: { color: "naranja", bpm: 128, beats: 1 },
        wave: { color: "azul", color2: "morado", bpm: 128, beats: 4 },
        twinkle: { color: "azul", color2: "morado", density: 0.15, bpm: 128 },
        build: { color: "blanco", dur_ms: 8000 }, prebuild: { color: "azul", dur_ms: 8000 }, flash: { color: "blanco", dur_ms: 200 },
        strobe: { dur_ms: 1000, hz: 12 }, rainbow: { dur_ms: 4000 }, off: {} };
  const box = document.getElementById("tests");
  Object.entries(effects).forEach(([fx, params]) => {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<b></b><input><button>Enviar</button>`;
    row.querySelector("b").textContent = fx;
    const input = row.querySelector("input"); input.value = paramsText(params).replace("bpm=live", "bpm=128");
    row.querySelector("button").onclick = () => {
      const extra = document.getElementById("zones").value.trim();
      const body = { fx, ...parseParams(input.value) };
      if (extra && body.zones === undefined) body.zones = extra;
      fetch("/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    };
    box.appendChild(row);
  });
});
</script>
</body>
</html>
