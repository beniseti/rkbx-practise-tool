; Firmware de luces para rkbx-practise-tool (ESP32-WROOM-32D / "ESP32D").
;   pio run -t upload        compilar y subir
;   pio device monitor       ver el monitor serie (115200)
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
lib_deps =
    fastled/FastLED@3.7.8
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
build_unflags = -Os
