[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rkbx-practice"
version = "0.1.0"
description = "Asistente de práctica para Rekordbox 7 (uso personal, Windows)"
requires-python = ">=3.11"
dependencies = [
    "pyrekordbox>=0.4",
    "pymem>=1.13; sys_platform == 'win32'",
    "PySide6>=6.6",
]

[project.optional-dependencies]
tools = ["numpy>=1.26"]
# Grabación del audio de la sesión: captura WASAPI (loopback) y archivos FLAC/WAV/OGG.
audio = ["soundcard>=0.4.3", "soundfile>=0.12", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.scripts]
rkbx-practice = "rkbx_practice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rkbx_practice = ["lights/*.html", "review/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
